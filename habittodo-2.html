<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Привычки и Дела">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#4338CA">
  <title>Привычки и Дела</title>
  <style>
    :root {
      --bg: #ECEEFF; --surface: #fff; --primary: #4338CA;
      --primary-light: #EEF2FF; --text: #1E1B4B; --muted: #9CA3AF;
      --border: #DDDFF8; --done: #059669; --danger: #DC2626;
      --safe-top: env(safe-area-inset-top, 20px);
      --safe-bot: env(safe-area-inset-bottom, 0px);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; overscroll-behavior: none; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif; background: var(--bg); color: var(--text); -webkit-font-smoothing: antialiased; }

    /* Header */
    .hdr { position: sticky; top: 0; z-index: 40; background: rgba(255,255,255,0.9); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-bottom: 1px solid var(--border); padding: calc(var(--safe-top) + 6px) 18px 12px; }
    .hdr h1 { font-size: 19px; font-weight: 800; letter-spacing: -.5px; }

    /* Scroll content */
    .content { padding: 14px 13px calc(80px + var(--safe-bot)); }

    /* Tab bar */
    .tab-bar { position: fixed; bottom: 0; left: 0; right: 0; z-index: 40; background: rgba(255,255,255,0.94); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-top: 1px solid var(--border); display: flex; padding-bottom: var(--safe-bot); }
    .tab-btn { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 8px 0 6px; border: none; background: none; cursor: pointer; color: var(--muted); font-size: 10.5px; font-weight: 600; font-family: inherit; gap: 3px; transition: color .15s; }
    .tab-btn.active { color: var(--primary); }
    .tab-icon { font-size: 22px; line-height: 1; }

    /* Greeting */
    .greeting { background: linear-gradient(135deg, #F43F5E 0%, #EC4899 100%); border-radius: 18px; padding: 18px 20px; margin-bottom: 14px; color: #fff; box-shadow: 0 6px 24px rgba(244,63,94,0.35); }
    .greeting-icon { font-size: 26px; margin-bottom: 8px; }
    .greeting-text { font-size: 16px; font-weight: 600; line-height: 1.6; }

    /* Counter */
    .counter { background: linear-gradient(135deg, #4338CA 0%, #7C3AED 100%); border-radius: 18px; padding: 18px 20px; margin-bottom: 20px; color: #fff; display: flex; align-items: center; gap: 16px; box-shadow: 0 6px 24px rgba(67,56,202,0.32); }
    .counter-n { font-size: 52px; font-weight: 900; line-height: 1; letter-spacing: -3px; flex-shrink: 0; }
    .counter-lbl { font-size: 15px; font-weight: 600; opacity: .92; line-height: 1.3; }
    .counter-sub { font-size: 12px; opacity: .55; margin-top: 3px; }

    /* Section */
    .sec { margin-bottom: 22px; }
    .sec-hdr { display: flex; align-items: center; justify-content: space-between; padding: 0 2px; margin-bottom: 10px; }
    .sec-title { font-size: 14.5px; font-weight: 700; }
    .btn-add { background: var(--primary-light); border: none; color: var(--primary); font-size: 12.5px; font-weight: 700; font-family: inherit; padding: 5px 13px; border-radius: 20px; cursor: pointer; }
    .btn-add:active { opacity: .7; }
    .empty { border: 1.5px dashed var(--border); border-radius: 16px; padding: 18px; text-align: center; color: var(--muted); font-size: 13.5px; line-height: 1.5; background: rgba(255,255,255,0.5); }

    /* Rows */
    .rw { position: relative; border-radius: 16px; margin-bottom: 8px; overflow: hidden; }
    .rw-del { position: absolute; right: 0; top: 0; bottom: 0; width: 80px; background: var(--danger); display: flex; align-items: center; justify-content: center; color: #fff; font-size: 13px; font-weight: 700; cursor: pointer; border-radius: 16px; }
    .rw-in { position: relative; z-index: 1; background: var(--surface); border-radius: 16px; display: flex; align-items: center; gap: 10px; padding: 12px 12px; box-shadow: 0 1px 4px rgba(99,102,241,0.09); will-change: transform; }
    .rw-in.imp { background: #FFFBEB; box-shadow: 0 1px 4px rgba(217,119,6,0.13); }

    /* Habit check */
    .hc { width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--border); background: #fff; flex-shrink: 0; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: background .15s, border-color .15s; }
    .hc.done { background: var(--done); border-color: var(--done); }
    .hc.done::after { content: '✓'; color: #fff; font-size: 13px; font-weight: 900; }
    .h-name { flex: 1; font-size: 15.5px; font-weight: 500; word-break: break-word; }
    .h-st { display: flex; flex-direction: column; align-items: flex-end; margin-right: 2px; min-width: 34px; }
    .h-st-n { font-size: 17px; font-weight: 800; line-height: 1; color: var(--primary); }
    .h-st-n.z { color: var(--muted); }
    .h-st-w { font-size: 10px; color: var(--muted); margin-top: 1px; }

    /* Task check */
    .tc { width: 24px; height: 24px; border-radius: 7px; border: 2px solid var(--border); background: #fff; flex-shrink: 0; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: background .15s; }
    .tc.done { background: var(--done); border-color: var(--done); }
    .tc.done::after { content: '✓'; color: #fff; font-size: 12px; font-weight: 900; }
    .t-title { flex: 1; font-size: 15px; font-weight: 500; line-height: 1.35; word-break: break-word; }
    .t-title.done { text-decoration: line-through; color: var(--muted); }
    .t-star { flex-shrink: 0; background: none; border: none; font-size: 20px; cursor: pointer; padding: 0 2px; line-height: 1; transition: transform .12s; }
    .t-star:active { transform: scale(.8); }
    .btn-tr { flex-shrink: 0; background: none; border: none; cursor: pointer; padding: 4px; display: flex; align-items: center; color: #CBD5E1; }
    .btn-tr:active { color: var(--primary); }
    .btn-tr.del:active { color: var(--danger); }
    .ico { width: 15px; height: 15px; stroke: currentColor; stroke-width: 2.1; fill: none; stroke-linecap: round; stroke-linejoin: round; }

    /* History tab */
    .hist-empty { text-align: center; padding: 60px 20px; color: var(--muted); }
    .hist-empty-icon { font-size: 48px; margin-bottom: 12px; }
    .hist-empty-text { font-size: 15px; line-height: 1.6; }

    .hist-group-label { font-size: 12px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; padding: 0 2px; margin: 16px 0 8px; }
    .hist-group-label:first-child { margin-top: 0; }

    .hist-item { background: var(--surface); border-radius: 14px; padding: 12px 14px; margin-bottom: 8px; display: flex; align-items: center; gap: 12px; box-shadow: 0 1px 4px rgba(99,102,241,0.09); }
    .hist-check { width: 26px; height: 26px; border-radius: 7px; background: var(--done); flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
    .hist-check::after { content: '✓'; color: #fff; font-size: 13px; font-weight: 900; }
    .hist-title { flex: 1; font-size: 15px; font-weight: 500; color: var(--text); }
    .hist-time { font-size: 12px; color: var(--muted); flex-shrink: 0; }

    /* Sheet */
    .overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.38); z-index: 50; }
    .overlay.open { display: block; }
    .sheet { position: fixed; bottom: 0; left: 0; right: 0; background: var(--surface); border-radius: 22px 22px 0 0; padding: 0 18px calc(24px + var(--safe-bot)); z-index: 51; transform: translateY(100%); transition: transform .3s cubic-bezier(0.25,1,0.5,1); }
    .sheet.open { transform: translateY(0); }
    .knob { width: 38px; height: 4px; background: #E5E7EB; border-radius: 2px; margin: 10px auto 18px; }
    .sheet h2 { font-size: 17px; font-weight: 800; color: var(--text); margin-bottom: 14px; }
    .s-inp { width: 100%; font-size: 16px; font-family: inherit; padding: 13px 14px; border-radius: 12px; border: 1.5px solid var(--border); background: var(--bg); color: var(--text); outline: none; }
    .s-inp:focus { border-color: var(--primary); }
    .s-btns { display: flex; gap: 10px; margin-top: 12px; }
    .s-btn { flex: 1; padding: 13px; border-radius: 12px; border: none; font-size: 16px; font-weight: 700; font-family: inherit; cursor: pointer; }
    .s-btn:active { opacity: .75; }
    .s-cancel { background: #F3F4F6; color: #374151; }
    .s-ok { background: var(--primary); color: #fff; }

    .snack { position: fixed; bottom: calc(70px + var(--safe-bot)); left: 13px; right: 13px; background: #111827; color: #fff; padding: 13px 16px; border-radius: 14px; font-size: 14px; font-weight: 500; text-align: center; z-index: 60; transform: translateY(120%); transition: transform .3s cubic-bezier(0.25,1,0.5,1); }
    .snack.show { transform: translateY(0); }
  </style>
</head>
<body>

<div class="hdr"><h1 id="page-title">Привычки и Дела</h1></div>
<div class="content" id="app"></div>

<div class="tab-bar">
  <button class="tab-btn active" id="tab-tasks" onclick="switchTab('tasks')">
    <span class="tab-icon">📋</span>Дела
  </button>
  <button class="tab-btn" id="tab-history" onclick="switchTab('history')">
    <span class="tab-icon">📅</span>История
  </button>
</div>

<div class="overlay" id="ov"></div>
<div class="sheet" id="sh">
  <div class="knob"></div>
  <h2 id="sh-title"></h2>
  <input class="s-inp" id="sh-inp" type="text" autocapitalize="sentences" autocorrect="on">
  <div class="s-btns">
    <button class="s-btn s-cancel" id="sh-cancel">Отмена</button>
    <button class="s-btn s-ok" id="sh-ok">Сохранить</button>
  </div>
</div>
<div class="snack" id="snack"></div>

<script>
// ── State ──────────────────────────────────────────────────────────────────
let S = { habits: [], tasks: [], history: [], completedImportantCount: 0 };
try {
  const old = localStorage.getItem('ht_v1');
  const cur = localStorage.getItem('ht_v2');
  const cur3 = localStorage.getItem('ht_v3');
  if (cur3) { S = JSON.parse(cur3); }
  else if (cur) { const d = JSON.parse(cur); S = { ...S, ...d }; }
  else if (old) { const d = JSON.parse(old); S = { ...S, ...d }; localStorage.removeItem('ht_v1'); }
  if (!S.history) S.history = [];
} catch(e) {}
const save = () => { try { localStorage.setItem('ht_v3', JSON.stringify(S)); } catch(e) {} };

let activeTab = 'tasks';

// ── Utils ──────────────────────────────────────────────────────────────────
const today = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; };
const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function taskWord(n) { const r=n%100,r10=n%10; if(r>=11&&r<15)return'дел'; if(r10===1)return'дело'; if(r10>=2&&r10<5)return'дела'; return'дел'; }
function dayWord(n)  { const r=n%100,r10=n%10; if(r>=11&&r<15)return'дней'; if(r10===1)return'день'; if(r10>=2&&r10<5)return'дня'; return'дней'; }
function calcStreak(h) {
  const dates = new Set(h.doneDates);
  const fmt = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  let d = new Date(); d.setHours(0,0,0,0);
  if (!dates.has(fmt(d))) d = new Date(d - 864e5);
  let n = 0; while (dates.has(fmt(d))) { n++; d = new Date(d - 864e5); } return n;
}

function formatHistDate(iso) {
  const t = today();
  const y = new Date(); y.setDate(y.getDate()-1);
  const yStr = `${y.getFullYear()}-${String(y.getMonth()+1).padStart(2,'0')}-${String(y.getDate()).padStart(2,'0')}`;
  const dStr = iso.split('T')[0];
  if (dStr === t) return 'Сегодня';
  if (dStr === yStr) return 'Вчера';
  const d = new Date(iso);
  const months = ['янв','фев','мар','апр','мая','июн','июл','авг','сен','окт','ноя','дек'];
  return `${d.getDate()} ${months[d.getMonth()]}`;
}

function formatHistTime(iso) {
  const d = new Date(iso);
  return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}

// ── Tab switching ──────────────────────────────────────────────────────────
function switchTab(tab) {
  activeTab = tab;
  document.getElementById('tab-tasks').classList.toggle('active', tab==='tasks');
  document.getElementById('tab-history').classList.toggle('active', tab==='history');
  document.getElementById('page-title').textContent = tab==='tasks' ? 'Привычки и Дела' : 'История дел';
  render();
}

// ── Swipe ──────────────────────────────────────────────────────────────────
let openSwipe = null;
function makeSwipeable(inner) {
  let sx=0, sy=0, tracking=false, opened=false;
  const snap = (x, anim=true) => {
    inner.style.transition = anim ? 'transform .22s ease' : 'none';
    inner.style.transform = x ? `translateX(${x}px)` : '';
    opened = x !== 0;
    if (anim) setTimeout(() => inner.style.transition = '', 250);
  };
  inner._open  = () => { if (openSwipe && openSwipe !== inner) openSwipe._close(); snap(-80); openSwipe = inner; };
  inner._close = () => { snap(0); if (openSwipe === inner) openSwipe = null; };
  inner.addEventListener('touchstart', e => {
    if (openSwipe && openSwipe !== inner) { openSwipe._close(); tracking=false; return; }
    sx=e.touches[0].clientX; sy=e.touches[0].clientY; tracking=true; inner.style.transition='none';
  }, {passive:true});
  inner.addEventListener('touchmove', e => {
    if (!tracking) return;
    const dx=e.touches[0].clientX-sx, dy=e.touches[0].clientY-sy;
    if (Math.abs(dy)>Math.abs(dx)+5) { tracking=false; return; }
    if (dx<0&&!opened) inner.style.transform=`translateX(${Math.max(dx,-80)}px)`;
    else if (dx>0&&opened) inner.style.transform=`translateX(${Math.min(dx-80,0)}px)`;
  }, {passive:true});
  inner.addEventListener('touchend', e => {
    if (!tracking) return; tracking=false;
    const dx=e.changedTouches[0].clientX-sx;
    if (!opened&&dx<-50) inner._open();
    else if (opened&&dx>30) inner._close();
    else if (!opened) snap(0); else inner._open();
  }, {passive:true});
}
document.addEventListener('touchstart', e => {
  if (!openSwipe) return;
  const wrap=openSwipe.closest&&openSwipe.closest('.rw');
  if (wrap&&!wrap.contains(e.target)) openSwipe._close();
}, {passive:true});

// ── Operations ─────────────────────────────────────────────────────────────
function addHabit(name)    { name=name.trim(); if(!name)return; S.habits.push({id:Date.now(),name,doneDates:[]}); save(); render(); }
function deleteHabit(id)   { S.habits=S.habits.filter(h=>h.id!==id); save(); render(); }
function editHabit(id)     { const h=S.habits.find(h=>h.id===id); if(!h)return; openSheet('Редактировать привычку','',v=>{v=v.trim();if(!v)return;S.habits=S.habits.map(h=>h.id===id?{...h,name:v}:h);save();render();},h.name); }
function toggleHabit(id)   {
  const t=today();
  S.habits=S.habits.map(h=>h.id!==id?h:{...h,doneDates:h.doneDates.includes(t)?h.doneDates.filter(d=>d!==t):[...h.doneDates,t]});
  save(); render();
}
function addTask(title)    { title=title.trim(); if(!title)return; S.tasks.push({id:Date.now(),title,done:false,important:false}); save(); render(); }
function addImpTask(title) { title=title.trim(); if(!title)return; if(S.tasks.filter(t=>t.important).length>=5){showSnack('В главных уже 5 дел. Сначала уберите одно из них.');return;} S.tasks.push({id:Date.now(),title,done:false,important:true}); save(); render(); }
function deleteTask(id)    { S.tasks=S.tasks.filter(t=>t.id!==id); save(); render(); }
function editTask(id)      { const t=S.tasks.find(t=>t.id===id); if(!t)return; openSheet('Редактировать дело','',v=>{v=v.trim();if(!v)return;S.tasks=S.tasks.map(t=>t.id===id?{...t,title:v}:t);save();render();},t.title); }
function toggleDone(id)    {
  const task=S.tasks.find(t=>t.id===id); if(!task)return;
  const nowDone=!task.done;
  if (task.important) {
    if (nowDone) {
      S.history.unshift({ hid: Date.now(), taskId: id, title: task.title, completedAt: new Date().toISOString() });
      S.completedImportantCount++;
    } else {
      const idx=S.history.findIndex(h=>h.taskId===id);
      if (idx!==-1) S.history.splice(idx,1);
      S.completedImportantCount=Math.max(0,S.completedImportantCount-1);
    }
  }
  S.tasks=S.tasks.map(t=>t.id===id?{...t,done:nowDone}:t);
  save(); render();
}
function toggleImp(id)     {
  const task=S.tasks.find(t=>t.id===id); if(!task)return;
  if (!task.important&&S.tasks.filter(t=>t.important).length>=5){showSnack('В главных уже 5 дел. Сначала уберите одно из них.');return;}
  if (task.important&&task.done) {
    const idx=S.history.findIndex(h=>h.taskId===id);
    if (idx!==-1) S.history.splice(idx,1);
    S.completedImportantCount=Math.max(0,S.completedImportantCount-1);
  }
  S.tasks=S.tasks.map(t=>t.id===id?{...t,important:!t.important,done:task.important?false:t.done}:t);
  save(); render();
}

// ── Snackbar ───────────────────────────────────────────────────────────────
let snackT=null;
function showSnack(msg) {
  const el=document.getElementById('snack');
  el.textContent=msg; el.classList.add('show');
  if(snackT) clearTimeout(snackT);
  snackT=setTimeout(()=>el.classList.remove('show'),3500);
}

// ── Sheet ──────────────────────────────────────────────────────────────────
let shCb=null;
const ov=document.getElementById('ov'),sh=document.getElementById('sh'),shInp=document.getElementById('sh-inp');
function openSheet(title,placeholder,cb,initVal=''){
  shCb=cb; document.getElementById('sh-title').textContent=title;
  shInp.placeholder=placeholder; shInp.value=initVal;
  ov.classList.add('open'); sh.classList.add('open');
  setTimeout(()=>{shInp.focus();if(initVal)shInp.select();},330);
}
function closeSheet(){ov.classList.remove('open');sh.classList.remove('open');shInp.blur();shCb=null;}
function confirmSheet(){const v=shInp.value;if(shCb)shCb(v);closeSheet();}
ov.addEventListener('click',closeSheet);
document.getElementById('sh-cancel').addEventListener('click',closeSheet);
document.getElementById('sh-ok').addEventListener('click',confirmSheet);
shInp.addEventListener('keydown',e=>{if(e.key==='Enter')confirmSheet();});

// ── Icons ──────────────────────────────────────────────────────────────────
const ICO_TRASH  = `<svg class="ico" viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>`;
const ICO_PENCIL = `<svg class="ico" viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>`;

// ── HTML builders ──────────────────────────────────────────────────────────
function bHabit(h) {
  const done=h.doneDates.includes(today()),s=calcStreak(h);
  return `<div class="rw"><div class="rw-del" data-dh="${h.id}">Удалить</div>
    <div class="rw-in" id="hr${h.id}">
      <div class="hc${done?' done':''}" data-th="${h.id}"></div>
      <span class="h-name">${esc(h.name)}</span>
      <div class="h-st"><span class="h-st-n${s===0?' z':''}">${s>0?'🔥':''}${s}</span><span class="h-st-w">${dayWord(s)}</span></div>
      <button class="btn-tr" data-eh="${h.id}">${ICO_PENCIL}</button>
      <button class="btn-tr del" data-dh="${h.id}">${ICO_TRASH}</button>
    </div></div>`;
}
function bTaskImp(t) {
  return `<div class="rw"><div class="rw-del" data-dt="${t.id}">Удалить</div>
    <div class="rw-in imp" id="tri${t.id}">
      <div class="tc${t.done?' done':''}" data-td="${t.id}"></div>
      <span class="t-title${t.done?' done':''}">${esc(t.title)}</span>
      <button class="t-star" data-ti="${t.id}">☆</button>
      <button class="btn-tr" data-et="${t.id}">${ICO_PENCIL}</button>
      <button class="btn-tr del" data-dt="${t.id}">${ICO_TRASH}</button>
    </div></div>`;
}
function bTaskReg(t) {
  return `<div class="rw"><div class="rw-del" data-dt="${t.id}">Удалить</div>
    <div class="rw-in" id="tra${t.id}">
      <span class="t-title">${esc(t.title)}</span>
      <button class="t-star" data-ti="${t.id}">☆</button>
      <button class="btn-tr" data-et="${t.id}">${ICO_PENCIL}</button>
      <button class="btn-tr del" data-dt="${t.id}">${ICO_TRASH}</button>
    </div></div>`;
}

function buildHistory() {
  if (S.history.length===0) {
    return `<div class="hist-empty">
      <div class="hist-empty-icon">✅</div>
      <div class="hist-empty-text">Здесь будут появляться<br>выполненные важные дела</div>
    </div>`;
  }
  // Group by date label
  const groups = [];
  const seen = {};
  S.history.forEach(h => {
    const label = formatHistDate(h.completedAt);
    if (!seen[label]) { seen[label]=true; groups.push({label,items:[]}); }
    groups[groups.length-1].items.push(h);
  });
  return groups.map(g => `
    <div class="hist-group-label">${g.label}</div>
    ${g.items.map(h=>`
      <div class="hist-item">
        <div class="hist-check"></div>
        <span class="hist-title">${esc(h.title)}</span>
        <span class="hist-time">${formatHistTime(h.completedAt)}</span>
      </div>`).join('')}
  `).join('');
}

// ── Render ─────────────────────────────────────────────────────────────────
function render() {
  openSwipe=null;
  const app=document.getElementById('app');

  if (activeTab==='history') {
    app.innerHTML = buildHistory();
    return;
  }

  const cnt=S.history.length || S.completedImportantCount;
  const impTasks=S.tasks.filter(t=>t.important);
  const regTasks=S.tasks.filter(t=>!t.important);
  const ic=impTasks.length;

  app.innerHTML=`
    <div class="greeting">
      <div class="greeting-icon">❤️</div>
      <div class="greeting-text">Дорогая жена, желаю хорошего дня!<br>Я тебя люблю ❤️<br>Ты можешь всё 👑</div>
    </div>
    <div class="counter">
      <span class="counter-n">${cnt}</span>
      <div><div class="counter-lbl">${taskWord(cnt)} выполнено</div><div class="counter-sub">из важных дел</div></div>
    </div>
    <div class="sec">
      <div class="sec-hdr"><span class="sec-title">Ежедневные привычки</span><button class="btn-add" data-ah>+ Добавить</button></div>
      ${S.habits.length===0?'<div class="empty">Добавьте привычку, которую хотите отмечать каждый день</div>':S.habits.map(bHabit).join('')}
    </div>
    <div class="sec">
      <div class="sec-hdr"><span class="sec-title">⭐ Главные дела (${ic}/5)</span><button class="btn-add" data-ait>+ Добавить</button></div>
      ${impTasks.length===0?'<div class="empty">Нажмите ☆ у любого дела, чтобы сделать его главным</div>':impTasks.map(bTaskImp).join('')}
    </div>
    <div class="sec">
      <div class="sec-hdr"><span class="sec-title">Все дела</span><button class="btn-add" data-at>+ Добавить</button></div>
      ${regTasks.length===0?'<div class="empty">Список пуст — добавьте новое дело кнопкой выше</div>':regTasks.map(bTaskReg).join('')}
    </div>`;

  S.habits.forEach(h=>{const e=document.getElementById(`hr${h.id}`);if(e)makeSwipeable(e);});
  impTasks.forEach(t=>{const e=document.getElementById(`tri${t.id}`);if(e)makeSwipeable(e);});
  regTasks.forEach(t=>{const e=document.getElementById(`tra${t.id}`);if(e)makeSwipeable(e);});
}

// ── Event delegation ───────────────────────────────────────────────────────
document.getElementById('app').addEventListener('click', e => {
  const dh=e.target.closest('[data-dh]');  if(dh){deleteHabit(+dh.dataset.dh);return;}
  const dt=e.target.closest('[data-dt]');  if(dt){deleteTask(+dt.dataset.dt);return;}
  const th=e.target.closest('[data-th]');  if(th){toggleHabit(+th.dataset.th);return;}
  const td=e.target.closest('[data-td]');  if(td){toggleDone(+td.dataset.td);return;}
  const ti=e.target.closest('[data-ti]');  if(ti){toggleImp(+ti.dataset.ti);return;}
  const eh=e.target.closest('[data-eh]');  if(eh){editHabit(+eh.dataset.eh);return;}
  const et=e.target.closest('[data-et]');  if(et){editTask(+et.dataset.et);return;}
  const ah=e.target.closest('[data-ah]');  if(ah){openSheet('Новая привычка','Название привычки…',addHabit);return;}
  const ait=e.target.closest('[data-ait]');if(ait){openSheet('Новое главное дело','Название дела…',addImpTask);return;}
  const at=e.target.closest('[data-at]');  if(at){openSheet('Новое дело','Название дела…',addTask);return;}
});

render();
</script>
</body>
</html>
